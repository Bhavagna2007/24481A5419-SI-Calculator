<!DOCTYPE html>
<html lang="en">

<head>
    <title>Simple Interest Calculator</title>
</head>

<body>

    <center>

        <h1 style="color: blue;">Simple Interest Calculator</h1>

        <form action="/calculator" method="POST">

            <label>Principal Amount:</label>
            <input type="number" name="p" step="any" required>
            <br><br>

            <label>Time (in years):</label>
            <input type="number" name="t" step="any" required>
            <br><br>

            <label>Rate of Interest (%):</label>
            <input type="number" name="r" step="any" required>
            <br><br>

            <input type="submit" value="Calculate">

        </form>

    </center>

</body>

</html>
